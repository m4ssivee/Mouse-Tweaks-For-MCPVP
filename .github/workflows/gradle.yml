name: Java CI with Gradle

on:
  push:
    paths-ignore:
      - '*.md'
      - '*.txt'
  pull_request:
    paths-ignore:
      - '*.md'
      - '*.txt'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build (Fabric)
        run: ./gradlew build

      - uses: actions/upload-artifact@v4
        with:
          name: McpvpInventoryHelper
          path: build/libs/
          if-no-files-found: error
